<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLAGHACK ∞ — Survey Flags</title>
    <meta name="description" content="A vexillomantic 1v1v1v1 action-strategy game on an aperiodic Ley Lattice." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0b14'/%3E%3Crect x='7' y='4' width='2.5' height='25' fill='%23c8a060'/%3E%3Cpath d='M9.5 5h15l-3 5 3 5h-15z' fill='%23ffd400'/%3E%3C/svg%3E"
    />
    <style>
      html,body{margin:0;height:100%;background:#08070d;color:#f3e6c4}
      #startup{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#08070d;font:16px/1.5 system-ui,sans-serif}
      #startup [hidden]{display:none!important}
      #startup-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;visibility:hidden}
      #startup[data-video="playing"] #startup-video{visibility:visible}
      .startup-brand{font-size:clamp(28px,6vw,72px);letter-spacing:.12em;color:#ffd400;text-align:center}
      #startup[data-video="playing"] .startup-brand{visibility:hidden}
      .startup-bottom{position:absolute;inset:auto 0 0;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:16px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
      #startup-status{flex:1;font-size:14px;text-shadow:0 1px 4px #000}
      #startup button{font:600 14px system-ui,sans-serif;min-height:44px;min-width:100px;padding:10px 18px;color:#f3e6c4;background:#191621;border:1px solid #88764f;border-radius:4px;cursor:pointer}
      #startup button:focus-visible{outline:3px solid #ffd400;outline-offset:3px}
      #startup button:disabled{cursor:default;opacity:.7}
      #startup-skip:not(:disabled){color:#111;background:#ffd400;border-color:#ffd400}
      @media(max-width:520px){.startup-bottom{flex-wrap:wrap;padding:16px}#startup-status{flex-basis:100%}}
    </style>
  </head>
  <body>
    <section id="startup" role="dialog" aria-modal="true" aria-label="FLAGHACK startup" aria-busy="true" data-video="off">
      <video id="startup-video" muted playsinline preload="none" aria-hidden="true"></video>
      <div class="startup-brand">FLAGHACK ∞</div>
      <div class="startup-bottom">
        <span id="startup-status" role="status" aria-live="polite">Preparing the game…</span>
        <button id="startup-sound" type="button" aria-pressed="false" hidden>Sound on</button>
        <button id="startup-skip" type="button" disabled>Loading…</button>
        <button id="startup-reload" type="button" hidden>Reload</button>
      </div>
      <noscript>This game needs JavaScript enabled.</noscript>
    </section>
    <div id="app" inert>
      <canvas id="game"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
