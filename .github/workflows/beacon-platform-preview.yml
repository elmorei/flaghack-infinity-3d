name: Verify pickup and platform preview
on:
  push:
    branches: ['qa/beacon-card-drops-20261101']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build:pages
      - run: npm run build:server
      - run: npm run desktop:test
      - run: npm run host-app:test
      - run: npm run host-app:build
      - run: node scripts/verify-pages-build.cjs
  native-browser:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - name: Prepare native Chrome recording tools
        run: |
          npm install --prefix "$RUNNER_TEMP/flaghack-browser-test" --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
          node "$RUNNER_TEMP/flaghack-browser-test/node_modules/playwright/cli.js" install ffmpeg
      - name: Verify world pickup presentation and behavior
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-beacon-card-browser.mjs
      - name: Recheck existing sleeve viewer
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-frick-sleeve-browser.mjs
      - name: Upload native screenshots and normal-speed recordings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beacon-platform-native-smoke
          path: |
            web/host-release/beacon-card-smoke/
            web/host-release/frick-sleeve-smoke/
          if-no-files-found: warn
          retention-days: 14
