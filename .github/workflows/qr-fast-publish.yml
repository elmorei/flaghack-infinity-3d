name: Fast build and publish QR host fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qr-fast-publish.yml']
permissions:
  contents: read
concurrency:
  group: qr-invite-fast-publish
  cancel-in-progress: false
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite build && node scripts/write-pages-metadata.cjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: web/dist
  windows-host:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: elmorei/flaghack-infinity-3d
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite build --config vite.host.config.ts
      - run: node scripts/fetch-cloudflared.cjs
      - run: npx electron-builder --config electron-host-builder.cjs --win --x64 --publish never
      - name: Publish rebuilt host
        run: |
          $tag = "host-$env:GITHUB_SHA"
          $hash = (Get-FileHash host-release/Flaghack-Host-Windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Flaghack-Host-Windows-x64.exe" | Set-Content -Encoding ascii host-release/SHA256SUMS.txt
          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag host-release/Flaghack-Host-Windows-x64.exe host-release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Windows host with build-specific QR invites" --prerelease --notes "Portable Windows host. QR and browser invites request this exact build to avoid cached pages. Unsigned; keep running while playing."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  deploy-pages:
    needs: [client, windows-host]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deploy
