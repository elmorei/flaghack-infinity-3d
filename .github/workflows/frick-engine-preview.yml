name: Verify engine-rendered Frick-frack preview
on:
  push:
    branches: ['qa/engine-picnic-20261031']
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Only repeat cold desktop deals and attribute first-use costs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-browser:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
        id: build
      - name: Prepare native browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/flaghack-browser-test" --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
          node "$RUNNER_TEMP/flaghack-browser-test/node_modules/playwright/cli.js" install ffmpeg
      - name: Diagnose cold first-deal costs separately
        if: ${{ inputs.diagnostic == true || contains(github.event.head_commit.message, '[engine-diagnostic]') }}
        run: ENGINE_DIAGNOSTIC=1 NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-frick-engine-browser.mjs
      - name: Verify actual engine table, privacy and active-motion pacing
        if: ${{ inputs.diagnostic != true && !contains(github.event.head_commit.message, '[engine-diagnostic]') }}
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-frick-engine-browser.mjs
      - name: Verify six physical die faces and record normal-speed dice demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.diagnostic != true && !contains(github.event.head_commit.message, '[engine-diagnostic]') }}
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-frick-dice-browser.mjs
      - name: Verify authoritative Frick-frack gameplay controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.diagnostic != true && !contains(github.event.head_commit.message, '[engine-diagnostic]') }}
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-frick-frack-browser.mjs
      - name: Upload engine-native demo and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frick-engine-native-smoke
          path: |
            web/host-release/frick-engine-smoke/
            web/host-release/frick-frack-smoke/
            web/host-release/frick-dice-smoke/
          if-no-files-found: warn
          retention-days: 14
