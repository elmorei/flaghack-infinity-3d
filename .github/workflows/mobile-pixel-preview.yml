name: Verify mobile pixel preview
on:
  push:
    branches: ['qa/mobile-pixel-ui-20261103']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build:pages
      - run: npm run build:server
      - run: npm run desktop:test
      - run: npm run host-app:test
      - run: npm run host-app:build
      - run: node scripts/verify-pages-build.cjs
  native-browser:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - run: npm run build:server
      - name: Upload isolated preview build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-pixel-preview-build
          path: web/dist/
          retention-days: 14
      - name: Prepare native Chrome recording tools
        run: |
          npm install --prefix "$RUNNER_TEMP/flaghack-browser-test" --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
          node "$RUNNER_TEMP/flaghack-browser-test/node_modules/playwright/cli.js" install ffmpeg
      - name: Verify mobile pixel dialogue and desktop isolation
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-mobile-pixel-browser.mjs
      - name: Verify mobile field resources, timer and altar directions
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-mobile-hud-browser.mjs
      - name: Recheck mobile command interactions
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-mobile-command-browser.cjs
      - name: Verify automatic human styles and NPC Crow through real lobbies
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-auto-style-browser.mjs
      - name: Upload native screenshots and normal-speed recordings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-pixel-native-smoke
          path: |
            web/host-release/mobile-pixel-smoke/
            web/host-release/mobile-hud-smoke/
            web/host-release/mobile-command-smoke/
            web/host-release/auto-style-smoke/
          if-no-files-found: warn
          retention-days: 14
