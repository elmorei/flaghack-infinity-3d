name: Temporary live PC browser verification
on:
  push:
    branches: [testcapture/pc-startup-20261029]
permissions:
  contents: read
jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify actual public URL on native Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/flaghack-browser-test" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-live-pc-temporary.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pc-live-browser-evidence
          path: web/host-release/public-smoke/
          if-no-files-found: warn
          retention-days: 7
