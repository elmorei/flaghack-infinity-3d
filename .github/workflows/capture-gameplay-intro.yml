name: Capture temporary gameplay intro
on:
  push:
    branches: [capture/gameplay-intro-20261022]
    paths:
      - '.github/workflows/capture-gameplay-intro.yml'
      - 'web/bench/capture-gameplay-intro.mjs'
permissions:
  contents: read
concurrency:
  group: capture-gameplay-intro-20261022
  cancel-in-progress: true
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Use preinstalled browser and install encoder only
        timeout-minutes: 4
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version
            command -v ffmpeg || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          else
            google-chrome --version
            command -v xvfb-run
            command -v ffmpeg || sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Record staged actual gameplay with sandbox enabled
        env:
          CAPTURE_BASE_SHA: '2938df043f50bb798362e3e6b04e63009cb9767b'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            node bench/capture-gameplay-intro.mjs
          else
            xvfb-run -a -s '-screen 0 1280x720x24' node bench/capture-gameplay-intro.mjs
          fi
      - name: Upload video and capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flaghack-gameplay-intro-${{ matrix.os }}
          path: web/montage-output/
          if-no-files-found: error
          retention-days: 7
