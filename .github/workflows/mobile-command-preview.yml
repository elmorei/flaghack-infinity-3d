name: Verify mobile command preview
on:
  push:
    branches: [mobile-command-preview]
permissions:
  contents: read
jobs:
  mobile-match:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
      - name: Verify actual mobile matches in native Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/mobile-browser/node_modules" node scripts/verify-mobile-command-browser.cjs
      - name: Upload match screenshots and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-command-evidence
          path: web/host-release/mobile-command-smoke/
          if-no-files-found: warn
          retention-days: 14
