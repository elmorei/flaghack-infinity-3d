name: Verify Flaghack Gaiden preview
# Isolated preview only. No release, deployment, live refs or updater feeds.
on:
  push:
    branches: ['preview/mobile-gaiden-name']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build:pages
      - run: node scripts/verify-pages-build.cjs
      - run: npm run build:server
      - run: npm run desktop:test
      - run: npm run host-app:test
      - run: npm run host-app:build
  native-branding:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - name: Prepare browser tools
        run: npm install --prefix "$RUNNER_TEMP/flaghack-browser-test" --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
      - name: Verify production startup, edition names, real title art and navigation
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-gaiden-branding-browser.mjs
      - name: Retain isolated build and native screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaiden-branding-preview
          path: |
            web/dist/
            web/host-release/gaiden-branding-smoke/
          if-no-files-found: error
          retention-days: 14
