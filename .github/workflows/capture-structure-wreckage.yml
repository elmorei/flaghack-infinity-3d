name: Capture scaled structure wreckage
on:
  push:
    branches: [capture/structure-wreckage-20261027]
    paths:
      - '.github/workflows/capture-structure-wreckage.yml'
      - 'web/bench/capture-structure-wreckage.mjs'
permissions:
  contents: read
jobs:
  capture:
    if: false
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: command -v ffmpeg || brew install ffmpeg
      - name: Capture actual structure wreckage with native Metal
        env:
          CAPTURE_BASE_SHA: '2938df043f50bb798362e3e6b04e63009cb9767b'
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for n in {1..60}; do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node bench/capture-structure-wreckage.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flaghack-structure-wreckage
          path: web/wreckage-proof/
          retention-days: 7
          if-no-files-found: error
