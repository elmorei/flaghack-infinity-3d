name: Package captured scenery proof
on:
  push:
    branches: [testcapture/scenery-benefits-20261028]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: captured-scenery-benefits-proof
          run-id: 40638521115
          github-token: ${{ github.token }}
          path: raw-proof
      - name: Inspect diagnostics and encode original native frames
        run: |
          source_dir="$(dirname "$(find raw-proof -name capture-diagnostics.json -print -quit)")"
          test -f "$source_dir/0719.png"
          mkdir -p scenery-review
          cp "$source_dir/"*.json scenery-review/
          python3 - <<'PY'
          import json
          d=json.load(open('scenery-review/capture-diagnostics.json'))
          print(json.dumps({k:v for k,v in d.items() if k!='scenes'},indent=2))
          print('Scene assertions:',[(s['setup']['kind'],s['result']['assertions']) for s in d['scenes']])
          PY
          for n in 0000 0119 0120 0239 0240 0359 0360 0479 0480 0599 0600 0719; do cp "$source_dir/$n.png" scenery-review/; done
          ffmpeg -y -framerate 30 -i "$source_dir/%04d.png" -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart scenery-review/scenery-benefits.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -show_entries format=duration -of json scenery-review/scenery-benefits.mp4
          ffmpeg -v error -i scenery-review/scenery-benefits.mp4 -f null -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: captured-scenery-review
          path: scenery-review/
          retention-days: 7
