name: Temporary optional game rules proof
on:
  push:
    branches: [testcapture/optional-rules-20261028]
permissions:
  contents: read
concurrency:
  group: optional-rules-proof-20261028
  cancel-in-progress: true
jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install isolated browser harness
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/optional-rules-browser" --no-save --package-lock=false --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000 playwright@1.56.1
          ln -s "$RUNNER_TEMP/optional-rules-browser/node_modules/playwright" node_modules/playwright
      - run: brew install ffmpeg
      - name: Verify and render actual optional game rules
        run: |
          npm run typecheck
          npx vitest run server/optionalRules.test.ts server/lobbySettingsClient.test.ts src/render/vfx/crystalAttackFx.test.ts src/sim/systems/crystalAttacks.test.ts --maxWorkers=2
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/optional-rules-vite.log" 2>&1 &
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          node bench/capture-optional-rules.mjs
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -show_entries format=duration -of json optional-rules-proof/optional-rules.mp4
          ffmpeg -v error -i optional-rules-proof/optional-rules.mp4 -f null -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: captured-optional-rules-proof
          path: |
            web/optional-rules-proof/
            ${{ runner.temp }}/optional-rules-vite.log
          if-no-files-found: warn
          retention-days: 7
