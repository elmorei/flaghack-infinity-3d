name: Verify picnic blanket dealing preview
on:
  push:
    branches: ['qa/picnic-dealing-*']
  workflow_dispatch:
concurrency:
  group: picnic-dealing-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-browser:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - name: Record actual UI with staged public hands in stock Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/flaghack-browser-test" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/flaghack-browser-test/node_modules/playwright/cli.js" install ffmpeg
          NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-frick-animation-browser.mjs
      - name: Verify authoritative card interactions
        run: NODE_PATH="$RUNNER_TEMP/flaghack-browser-test/node_modules" node scripts/verify-frick-frack-browser.mjs
      - name: Upload animation demonstration and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frick-animation-smoke
          path: web/host-release/frick-animation-smoke/
          if-no-files-found: warn
          retention-days: 14
