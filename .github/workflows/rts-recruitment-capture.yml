name: Temporary RTS recruitment throne desk proof
on:
  push:
    branches: [testcapture/rts-recruitment-20261028]
permissions:
  contents: read
concurrency:
  group: rts-recruitment-proof-20261028
  cancel-in-progress: true
jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000
      - name: Install isolated browser harness
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/rts-browser" --no-save --package-lock=false --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000 playwright@1.56.1
          ln -s "$RUNNER_TEMP/rts-browser/node_modules/playwright" node_modules/playwright
      - run: brew install ffmpeg
      - name: Verify and render actual RTS recruitment and rulers
        run: |
          npm run typecheck
          npx vitest run tests/rtsProof.test.ts src/render/actors/throneRenderer.test.ts src/sim/systems/throneAttacks.test.ts --maxWorkers=2
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/rts-vite.log" 2>&1 &
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          CAPTURE_OUT="$RUNNER_TEMP/rts-proof" CAPTURE_URL=http://127.0.0.1:5173/ node bench/capture-rts-recruitment.mjs
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -show_entries format=duration -of json "$RUNNER_TEMP/rts-proof/rts-recruitment.mp4"
          ffmpeg -v error -i "$RUNNER_TEMP/rts-proof/rts-recruitment.mp4" -f null -
      - name: Preserve bounded partial capture on failure
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/rts-proof/rts-recruitment.mp4" ] && [ -f "$RUNNER_TEMP/rts-proof/0000.png" ]; then
            ffmpeg -y -framerate 30 -i "$RUNNER_TEMP/rts-proof/%04d.png" -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart "$RUNNER_TEMP/rts-proof/rts-recruitment-partial.mp4"
            python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"rts-proof"; fs=sorted(p.glob("[0-9][0-9][0-9][0-9].png")); [f.unlink() for i,f in enumerate(fs) if i%30 and i!=len(fs)-1]'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: captured-rts-recruitment-proof
          path: |
            ${{ runner.temp }}/rts-proof/
            ${{ runner.temp }}/rts-vite.log
          if-no-files-found: warn
          retention-days: 7
